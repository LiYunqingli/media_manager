<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>分类 - MediaManager</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mm_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var h = document.documentElement;
        h.setAttribute('data-theme', t);
        h.classList.toggle('dark', t === 'dark');
        h.classList.toggle('van-theme-dark', t === 'dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/vendor/vant.css" />
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/web.css" />
</head>
<body>
  <div id="app" v-cloak>
    <web-shell :user="user" :active="'cat-' + categoryId">
      <div class="detail-layout">

        <div>
          <!-- 分类 banner -->
          <section class="cat-hero" :class="{ 'cat-hero--plain': !category.cover_url }" v-if="category">
            <div class="cat-hero__bg">
              <img v-if="category.cover_url" :src="category.cover_url" :alt="category.name" />
              <div v-else class="cat-hero__fallback" :style="{ background: grad(category.name) }"></div>
            </div>
            <div class="cat-hero__mask"></div>
            <div class="cat-hero__content">
              <!-- 有封面才显示方形缩略图；无封面时背景渐变已表达同一信息，再放方块是冗余 -->
              <div class="cat-hero__avatar" v-if="category.cover_url">
                <img :src="category.cover_url" :alt="category.name" />
              </div>
              <div class="cat-hero__text">
                <div class="cat-hero__crumb" @click="goCategories">
                  <mm-icon name="grid" :size="13"></mm-icon>全部分类
                </div>
                <h1 class="cat-hero__name">{{ category.name }}</h1>
                <p class="cat-hero__desc">{{ category.description || '该分类暂无描述' }}</p>
                <div class="cat-hero__stats">
                  <span class="cat-hero__stat">
                    <mm-icon name="film" :size="13"></mm-icon>{{ total }} 个视频
                  </span>
                  <span class="cat-hero__stat" v-if="pages > 1">
                    <mm-icon name="document" :size="13"></mm-icon>第 {{ page }} / {{ pages }} 页
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- 工具条：分类快捷切换（窄屏变横向滚动标签条） -->
          <div class="cat-bar">
            <div class="cat-bar__tabs no-scrollbar">
              <span class="cat-bar__tab cat-bar__tab--all" @click="goCategories">全部</span>
              <span class="cat-bar__tab" v-for="c in allCategories" :key="'t' + c.id"
                    :class="{ 'cat-bar__tab--active': c.id === categoryId }"
                    @click="goCategory(c.id)">{{ c.name }}</span>
            </div>
            <label class="cat-bar__sort">
              <mm-icon name="trend" :size="13"></mm-icon>
              <select v-model="orderBy" @change="reload" aria-label="排序方式">
                <option value="created_at">最新发布</option>
                <option value="view_count">最多播放</option>
                <option value="duration">时长优先</option>
              </select>
            </label>
          </div>

          <v-skeleton v-if="loading" :count="8"></v-skeleton>

          <template v-else>
            <div class="mm-grid" v-if="videos.length">
              <v-card v-for="v in videos" :key="v.id" :video="v"></v-card>
            </div>
            <mm-empty v-else icon="folder" text="该分类下暂时没有视频">
              <span class="mm-btn mm-btn--sm" @click="goCategories">去其他分类看看</span>
            </mm-empty>
            <mm-pager :page="page" :pages="pages" :total="total" @change="changePage"></mm-pager>
          </template>
        </div>

        <!-- 右侧：其他分类 + 全站热门 -->
        <aside class="related-panel">
          <div class="mm-card" v-if="otherCategories.length">
            <div class="mm-card__head">
              <span class="mm-card__title">
                <mm-icon name="compass" :size="15"></mm-icon>换个分类看看
              </span>
              <span class="mm-section__more" @click="goCategories">
                全部
                <mm-icon name="chevron-right" :size="12"></mm-icon>
              </span>
            </div>
            <div class="mm-card__body mm-card__body--tight">
              <div class="related-list" style="max-height:none">
                <div class="v-item" v-for="c in otherCategories" :key="'c' + c.id" @click="goCategory(c.id)">
                  <div class="v-item__cover v-item__cover--sm">
                    <img v-if="c.cover_url" :src="c.cover_url" :alt="c.name" loading="lazy" @error="onImgError" />
                    <div v-else class="v-card__placeholder" :style="{ background: grad(c.name) }" style="font-size:14px">
                      {{ initials(c.name) }}
                    </div>
                  </div>
                  <div class="v-item__info">
                    <div class="v-item__title">{{ c.name }}</div>
                    <div class="v-card__meta"><span>{{ c.video_count }} 个视频</span></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="mm-card mm-mt-16" v-if="hot.length">
            <div class="mm-card__head">
              <span class="mm-card__title">
                <mm-icon name="fire" :size="15"></mm-icon>全站热门
              </span>
            </div>
            <div class="mm-card__body mm-card__body--tight">
              <v-item v-for="(v, i) in hot" :key="'h' + v.id" :video="v" :index="i + 1"></v-item>
            </div>
          </div>
        </aside>

      </div>
    </web-shell>
  </div>

  <script src="/static/vendor/vue.global.prod.js"></script>
  <script src="/static/vendor/vant.min.js"></script>
  <script src="/static/js/config.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/request.js"></script>
  <script src="/static/js/components-web.js"></script>
  <script src="/static/js/layout-web.js"></script>
  <script>
    (function () {
      var util = MM.util;

      MM.bootWeb({
        data: function () {
          return {
            user: MM.auth.getUser() || {},
            categoryId: Number(util.query('id', 0)),
            category: null,
            videos: [],
            allCategories: [],
            hot: [],
            page: Number(util.query('page', 1)),
            pageSize: MM.config.PAGE_SIZE,
            total: 0,
            pages: 1,
            orderBy: 'created_at',
            loading: true
          };
        },
        computed: {
          otherCategories: function () {
            var self = this;
            return this.allCategories.filter(function (c) {
              return c.id !== self.categoryId;
            });
          }
        },
        mounted: function () {
          this.loadCategories();
          this.loadHot();
          if (this.categoryId) this.load();
          else this.loading = false;
        },
        methods: {
          loadCategories: function () {
            var self = this;
            MM.http
              .get('/client/categories')
              .then(function (list) {
                self.allCategories = list || [];
                if (!self.category && self.categoryId) {
                  var found = self.allCategories.filter(function (c) {
                    return c.id === self.categoryId;
                  })[0];
                  if (found) self.category = found;
                }
              })
              .catch(function () {});
          },
          loadHot: function () {
            var self = this;
            MM.http
              .get('/client/videos', { page: 1, page_size: 8, order_by: 'view_count' })
              .then(function (data) {
                self.hot = (data.list || []).filter(function (v) {
                  return v.id !== 0;
                }).slice(0, 6);
              })
              .catch(function () {});
          },
          load: function () {
            var self = this;
            self.loading = true;
            MM.http
              .get('/client/categories/' + self.categoryId, {
                page: self.page,
                page_size: self.pageSize,
                order_by: self.orderBy
              })
              .then(function (data) {
                self.videos = data.list || [];
                self.total = data.total || 0;
                self.pages = data.pages || 1;
                self.category = data.category || self.category;
                self.loading = false;
                document.title = (self.category ? self.category.name : '分类') + ' - MediaManager';
              })
              .catch(function (err) {
                self.loading = false;
                MM.http.toastError(err);
              });
          },
          reload: function () {
            this.page = 1;
            this.load();
          },
          changePage: function (p) {
            this.page = p;
            this.load();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          },
          goCategories: function () {
            util.go(MM.config.PATHS.webCategories);
          },
          goCategory: function (id) {
            util.go(MM.config.PATHS.webCategory, { id: id });
          },
          grad: function (t) {
            return util.coverGradient(t);
          },
          initials: function (t) {
            return util.coverInitials(t);
          },
          onImgError: function (e) {
            e.target.style.display = 'none';
          }
        }
      });
    })();
  </script>
</body>
</html>
