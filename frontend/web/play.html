<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>播放 - MediaManager</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mm_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var h = document.documentElement;
        h.setAttribute('data-theme', t);
        h.classList.toggle('dark', t === 'dark');
        h.classList.toggle('van-theme-dark', t === 'dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/vendor/vant.css" />
  <link rel="stylesheet" href="/static/css/common.css" />
  <link rel="stylesheet" href="/static/css/web.css" />
  <style>
    /* 影院模式：播放器更宽，内容区收窄居中 */
    .theater-main {
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .theater-main .mp video {
      max-height: 76vh;
    }
    .play-side {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
    }
    .shortcut-tip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 11.5px;
      color: var(--text-3);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--panel-2);
      margin-top: 12px;
    }
    .shortcut-tip b {
      color: var(--text-2);
      font-weight: 500;
    }
    @media (max-width: 767px) {
      .theater-main {
        border-radius: 0;
        border-left: none;
        border-right: none;
      }
      .shortcut-tip {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <web-shell :user="user" :active="video ? 'cat-' + video.category_id : ''">

      <div v-if="loading" class="mm-skeleton" style="width:100%;aspect-ratio:16/9;border-radius:10px"></div>

      <mm-empty v-else-if="error" icon="⚠️" :text="error">
        <button class="mm-btn mm-btn--primary mm-mt-16" @click="backHome">返回首页</button>
      </mm-empty>

      <template v-else>
        <div class="detail-layout">
          <div>
            <div class="theater-main" id="player-host"></div>

            <h1 class="detail-title">{{ video.title }}</h1>
            <div class="detail-meta">
              <span class="mm-tag">{{ video.category_name || '未分类' }}</span>
              <span>👁 {{ count(viewCount) }} 次播放</span>
              <span>⏱ {{ video.duration_text }}</span>
              <span v-if="video.size_text">📦 {{ video.size_text }}</span>
              <div class="detail-actions">
                <button class="mm-btn" :class="{ 'mm-btn--primary': favorited }" @click="toggleFavorite">
                  {{ favorited ? '★ 已收藏' : '☆ 收藏' }}
                </button>
                <button class="mm-btn" @click="goDetail">📄 详情页</button>
                <button class="mm-btn" @click="pickNext">⏭ 下一个</button>
              </div>
            </div>

            <div class="detail-desc">{{ video.description || '暂无简介' }}</div>

            <div class="shortcut-tip">
              <span><b>空格/K</b> 播放暂停</span>
              <span><b>← →</b> 快退快进</span>
              <span><b>↑ ↓</b> 音量</span>
              <span><b>M</b> 静音</span>
              <span><b>F</b> 全屏</span>
              <span><b>W</b> 网页全屏</span>
              <span><b>[ ]</b> 调速</span>
              <span><b>0-9</b> 按比例跳转</span>
              <span><b>长按画面</b> 3 倍速</span>
              <span><b>左右滑动</b> 拖进度</span>
              <span><b>左半屏上下</b> 亮度</span>
              <span><b>右半屏上下</b> 音量</span>
            </div>
          </div>

          <aside class="play-side">
            <div class="mm-section__head">
              <h2 class="mm-section__title">接下来播放</h2>
              <span class="mm-section__more" @click="goCategory(video.category_id)">更多同类 →</span>
            </div>
            <div class="related-list">
              <v-item v-for="(v, i) in related" :key="'p' + v.id" :video="v" :index="i + 1"></v-item>
            </div>
            <mm-empty v-if="!related.length" text="暂无更多同分类视频"></mm-empty>
          </aside>
        </div>

        <!-- 底部再次推荐（长页面滚动后仍能看到推荐） -->
        <section class="mm-section" style="margin-top:26px" v-if="related.length > 3">
          <div class="mm-section__head">
            <h2 class="mm-section__title">更多「{{ video.category_name }}」内容</h2>
          </div>
          <div class="mm-grid">
            <v-card v-for="v in related" :key="'g' + v.id" :video="v"></v-card>
          </div>
        </section>
      </template>

    </web-shell>
  </div>

  <script src="/static/vendor/vue.global.prod.js"></script>
  <script src="/static/vendor/vant.min.js"></script>
  <script src="/static/js/config.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/request.js"></script>
  <script src="/static/js/components-web.js"></script>
  <script src="/static/js/layout-web.js"></script>
  <script src="/static/js/player.js"></script>
  <script>
    (function () {
      var util = MM.util;
      function uuid() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID().replace(/-/g, '');
        return 'seg' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      }

      MM.bootWeb({
        data: function () {
          return {
            user: MM.auth.getUser() || {},
            videoId: Number(util.query('id', 0)),
            video: null,
            related: [],
            loading: true,
            error: '',
            favorited: false,
            viewCount: 0,
            player: null,
            segmentId: uuid(),
            reportDisabled: false
          };
        },
        mounted: function () {
          if (!this.videoId) {
            this.error = '缺少视频参数';
            this.loading = false;
            return;
          }
          this.load();
        },
        beforeUnmount: function () {
          if (this.player) this.player.destroy();
        },
        methods: {
          load: function () {
            var self = this;
            self.loading = true;
            MM.http
              .get('/client/videos/' + self.videoId)
              .then(function (data) {
                self.video = data;
                self.favorited = !!data.favorited;
                self.viewCount = data.view_count;
                self.related = data.related || [];
                self.loading = false;
                document.title = data.title + ' - MediaManager';
                self.$nextTick(function () {
                  self.player = new MM.Player(document.getElementById('player-host'), {
                    src: data.play_url,
                    poster: data.cover_url,
                    title: data.title,
                    autoplay: true,
                    lastPosition: data.history ? data.history.last_position : 0,
                    onReport: function (p) {
                      self.report(p);
                    },
                    onEnded: function () {
                      self.playNextAuto();
                    }
                  });
                });
              })
              .catch(function (err) {
                self.loading = false;
                self.error =
                  [3003, 4004].indexOf(Number(err.code)) >= 0
                    ? '该视频不存在，或你没有观看权限'
                    : (err && err.message) || '加载失败';
              });
          },
          report: function (payload) {
            var self = this;
            if (self.reportDisabled) return;
            MM.http
              .post('/client/videos/' + self.videoId + '/play-report', {
                segment_id: self.segmentId,
                position: payload.position,
                duration: payload.duration,
                delta: payload.delta
              })
              .then(function (res) {
                self.viewCount = res.view_count;
              })
              .catch(function (err) {
                if ([3002, 3003, 4004].indexOf(Number(err.code)) >= 0) self.reportDisabled = true;
              });
          },
          playNextAuto: function () {
            var next = this.related[0];
            if (!next) {
              MM.vant.toast('播放结束');
              return;
            }
            MM.vant.confirm('即将播放：' + next.title).then(function () {
              util.go(MM.config.PATHS.webPlay, { id: next.id });
            });
          },
          pickNext: function () {
            var next = this.related[0];
            if (!next) {
              MM.vant.toast('没有更多同分类视频了');
              return;
            }
            util.go(MM.config.PATHS.webPlay, { id: next.id });
          },
          toggleFavorite: function () {
            var self = this;
            MM.http
              .post('/client/favorites/' + self.videoId + '/toggle')
              .then(function (res) {
                self.favorited = res.favorited;
                MM.vant.toast(res.favorited ? '已加入收藏' : '已取消收藏');
              })
              .catch(function (err) {
                MM.http.toastError(err);
              });
          },
          goDetail: function () {
            util.go(MM.config.PATHS.webDetail, { id: this.videoId });
          },
          goCategory: function (id) {
            util.go(MM.config.PATHS.webCategory, { id: id });
          },
          backHome: function () {
            util.go(MM.config.PATHS.webHome);
          },
          count: function (n) {
            return util.formatCount(n);
          }
        }
      });
    })();
  </script>
</body>
</html>
